[DEFAULT]
# Chroma-Shift OnAIR Configuration
# =================================
# This file configures the OnAIR cognitive architecture for the
# Chroma-Shift vegetation monitoring SmallSat mission.

TelemetryDataFilePath = onair_plugins/data_adapter/sim_data/chroma_shift_sim.csv
TelemetryMetadataFilePath = telemetry_metadata.json
ParserFileName = onair_plugins/data_adapter/chroma_shift_adapter.py

[DATA_HANDLING]
# 0 = CSV simulation mode (for development and demonstration)
# 1 = cFS/SBN flight mode (for integration with Core Flight System)
SBN_FLAG = 0

[PLUGINS]
# OnAIR plugin configuration
# Each plugin is mapped to its directory containing the plugin module.
# Plugin class must be named 'Plugin' and implement update() + render_reasoning().

KnowledgeRepPluginDict = {
    "radiometric": "onair_plugins/knowledge_rep/radiometric_pkr",
    "scene_analysis": "onair_plugins/knowledge_rep/scene_analysis_pkr"
    }

LearnersPluginDict = {
    "vegetation_classifier": "onair_plugins/learners/vegetation_classifier",
    "anomaly_detector": "onair_plugins/learners/anomaly_detector"
    }

PlannersPluginDict = {
    "observation_scheduler": "onair_plugins/planners/observation_scheduler",
    "crop_advisor": "onair_plugins/planners/crop_advisor_pp"
    }

ComplexPluginDict = {
    "mission_executive": "onair_plugins/complex_reasoners/mission_executive"
    }
